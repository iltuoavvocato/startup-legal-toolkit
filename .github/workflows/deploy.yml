name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site (https://<user>.github.io/<repo>/): base path = /<repo>/.
      # With a custom domain (public/CNAME), set BASE_PATH to "/" and SITE_URL to the domain.
      BASE_PATH: /${{ github.event.repository.name }}/
      SITE_URL: https://${{ github.repository_owner }}.github.io
      # Preview only: adds <meta name="robots" content="noindex, nofollow"> to every page.
      # Remove this line when the site goes live on its real domain.
      NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
